name: Matrix Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Tous les lundis à minuit UTC
    - cron: '0 0 * * 1'

jobs:
  build:
    name: Build on ${{ matrix.os }} with Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16, 18, 20]
        
        exclude:
          - os: ubuntu-latest
            node-version: 16
          - os: windows-latest
            node-version: 18
          - os: macos-latest
            node-version: 20
        
        include:
          - os: windows-latest
            node-version: 22
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Build project
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-node${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  conditional-job:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download Ubuntu Node 18 artifact
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-node18
          path: ./deployment
      
      - name: Display artifact content
        run: |
          echo "Artifact content:"
          ls -la ./deployment
          echo ""
          echo "Bundle content:"
          cat ./deployment/bundle.js
      
      - name: Simulate deployment
        run: |
          echo "Starting deployment"
          echo "Target: Production Environment"
          echo "Source: Ubuntu + Node 18 build"
          echo ""
          echo "Deployment steps:"
          echo "1. Artifact downloaded ok"
          echo "2. Files ok"
          echo "3. Deploying to prod"
          echo "4. Deployment ok"
          echo ""
          echo "Deployment ok ok"